name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        if: hashFiles('server/package.json') != ''
        run: npm --prefix server ci

      - name: Install client dependencies
        if: hashFiles('client/package.json') != ''
        run: npm --prefix client ci

      - name: Run verify
        run: npm run verify

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit root package
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Audit server package
        if: hashFiles('server/package.json') != ''
        continue-on-error: true
        run: npm --prefix server audit --omit=dev --audit-level=high

      - name: Audit client package
        if: hashFiles('client/package.json') != ''
        continue-on-error: true
        run: npm --prefix client audit --omit=dev --audit-level=high
